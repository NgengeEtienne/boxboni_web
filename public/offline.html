<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123fa6" />
    <title>Waypoint – offline</title>
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        background: #fff;
        color: #0d1b3d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { width: 100%; max-width: 360px; }
      img { width: 64px; height: 64px; border-radius: 32%; box-shadow: 0 10px 22px rgba(18, 63, 166, 0.35); }
      h1 { margin: 20px 0 6px; font-size: 22px; color: #0a2472; }
      p { margin: 0 0 24px; font-size: 14.5px; line-height: 1.5; color: #67718c; }
      button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 13px;
        background: #123fa6;
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Waypoint needs a connection to load this page. Check your mobile data or Wi-Fi and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload as soon as the connection comes back.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
